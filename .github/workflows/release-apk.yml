name: release-apk

# Builds the Android app and publishes it as a GitHub Release:
#   - every push to main updates the "latest" pre-release (apa-latest.apk), automatically;
#   - pushing a tag such as v0.1.0 makes a permanent release (apa-v0.1.0.apk) with generated notes.
# It is a debug build (signed with the debug key): fine for your own phone, not for the Play Store.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Name the file
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then NAME="apa-${GITHUB_REF_NAME}.apk"; else NAME="apa-latest.apk"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"
      - name: Publish a versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "APA $GITHUB_REF_NAME" --generate-notes
      - name: Update the latest build (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" --prerelease --target "$GITHUB_SHA" --title "Latest build (main)" \
            --notes "Automatic debug build of the newest commit on main (${GITHUB_SHA::7}). Install with adb or open the file on the phone. See docs/ANDROID.md."
