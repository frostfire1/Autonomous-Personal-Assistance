[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

# URL comes from DATABASE_URL in alembic/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
